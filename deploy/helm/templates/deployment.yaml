apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "huddle.fullname" . }}
  labels: {{- include "huddle.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "huddle.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "huddle.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Migrations run on boot and take an advisory lock, so several replicas
      # starting at once is safe and there is no init container.
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PUBLIC_URL
              value: {{ .Values.publicUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.postgres.urlKey }}

            # More than one replica needs the Postgres relay, so instances see
            # each other's realtime traffic. One replica does not.
            - name: HUDDLE_CLUSTER
              value: {{ gt (int .Values.replicaCount) 1 | quote }}

            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_FORCE_PATH_STYLE
              value: {{ .Values.s3.forcePathStyle | quote }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.s3.accessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.s3.secretAccessKeyKey }}

            - name: EMAIL_FROM
              value: {{ .Values.mail.from | quote }}
            {{- if .Values.mail.urlKey }}
            - name: SMTP_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.mail.urlKey }}
                  optional: true
            {{- end }}

            {{- if .Values.push.enabled }}
            - name: VAPID_SUBJECT
              value: {{ .Values.push.subject | quote }}
            - name: VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.push.publicKeyKey }}
            - name: VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.push.privateKeyKey }}
            {{- end }}

            {{- if .Values.ai.enabled }}
            - name: AI_BASE_URL
              value: {{ .Values.ai.baseUrl | quote }}
            - name: AI_MODEL
              value: {{ .Values.ai.model | quote }}
            - name: AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: {{ .Values.ai.apiKeyKey }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30

          resources: {{- toYaml .Values.resources | nindent 12 }}

          # The image carries a bundle and the migration files, and writes
          # nothing to disk: everything durable is in Postgres or the bucket.
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ['ALL']

      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
