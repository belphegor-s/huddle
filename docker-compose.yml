# The whole deployment. Two containers, one of which is Postgres.
#
# Object storage is not here on purpose: files go to whatever S3 compatible
# bucket you already pay for, so nothing in this file holds your data hostage
# and there is no extra service to keep alive and back up.

services:
  app:
    build: .
    image: ghcr.io/huddle/huddle:latest
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgres://huddle:${POSTGRES_PASSWORD:-huddle}@db:5432/huddle
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}

      # Any S3 compatible bucket. Leave S3_ENDPOINT empty for AWS itself.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-huddle}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}

      # Without SMTP, sign in links are printed to the container log, which is
      # enough to get in and try it.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-huddle <no-reply@localhost>}

      # Off unless you point it somewhere. No message content leaves the
      # deployment while these are empty.
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: huddle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-huddle}
      POSTGRES_DB: huddle
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U huddle -d huddle']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  db:
